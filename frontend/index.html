<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Phoenix Project: Simulator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="app-layout">

        <!-- LEFT SIDEBAR: Resources, Sprint & Game Info -->
        <aside id="sidebar">
            <div class="brand">
                <h1>PHOENIX<br><span>SIMULATOR</span></h1>
            </div>

            <div class="sidebar-section">
                <h3>LEVEL <span id="level-display">1</span></h3>
                <p class="level-title">The Stabilizer</p>
            </div>

            <!-- SPRINT PANEL -->
            <div class="sidebar-section sprint-section">
                <h3>SPRINT <span id="sprint-number">1</span></h3>
                <div class="sprint-phase" id="sprint-phase-display">
                    <span class="phase-indicator" id="phase-planning">PLANNING</span>
                    <span class="phase-arrow">→</span>
                    <span class="phase-indicator" id="phase-active">ACTIVE</span>
                    <span class="phase-arrow">→</span>
                    <span class="phase-indicator" id="phase-review">REVIEW</span>
                    <span class="phase-arrow">→</span>
                    <span class="phase-indicator" id="phase-retro">RETRO</span>
                </div>

                <!-- Capacity Display (Planning phase) -->
                <div id="sprint-capacity-panel" class="sprint-panel">
                    <label>Capacity (points):</label>
                    <div class="capacity-input">
                        <input type="number" id="capacity-input" value="10" min="1" max="50">
                        <button id="set-capacity-btn" class="small-btn">SET</button>
                    </div>
                </div>

                <!-- Sprint Goals (Planning phase) -->
                <div id="sprint-goals-panel" class="sprint-panel">
                    <label>Sprint Goals:</label>
                    <div id="sprint-goals-list" class="sprint-list"></div>
                    <div class="goal-input">
                        <input type="text" id="goal-input" placeholder="Add goal...">
                        <button id="add-goal-btn" class="small-btn">+</button>
                    </div>
                </div>

                <!-- Sprint Backlog (Planning/Active phases) -->
                <div id="sprint-backlog-panel" class="sprint-panel">
                    <label>Sprint Backlog: <span id="sprint-points">0</span>/<span id="sprint-capacity">10</span> pts</label>
                    <div id="sprint-tasks-list" class="sprint-tasks-list"></div>
                </div>

                <!-- Velocity Display (Active/Review phases) -->
                <div id="sprint-velocity-panel" class="sprint-panel" style="display:none;">
                    <label>Velocity: <span id="sprint-velocity">0</span> pts</label>
                    <div class="velocity-bar">
                        <div id="velocity-progress" class="velocity-progress" style="width: 0%;"></div>
                    </div>
                </div>

                <!-- Retro Panel (Retro phase) -->
                <div id="sprint-retro-panel" class="sprint-panel" style="display:none;">
                    <label>Retro Actions:</label>
                    <div id="retro-actions-list" class="sprint-list"></div>
                    <div class="retro-input">
                        <input type="text" id="retro-input" placeholder="Action item...">
                        <button id="add-retro-btn" class="small-btn">+</button>
                    </div>
                </div>

                <!-- Phase Controls -->
                <div class="sprint-controls">
                    <button id="advance-phase-btn" class="phase-btn">START SPRINT →</button>
                    <button id="complete-sprint-btn" class="phase-btn complete-btn" style="display:none;">COMPLETE SPRINT</button>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>RESOURCES</h3>
                <div id="resources-container">
                    <!-- Brent and others will appear here -->
                    <div class="resource-slot" id="resource-pool">
                        <!-- Draggable Avatars go here -->
                    </div>
                </div>
                <div class="instruction-text">
                    Drag resources to tasks to unblock them.
                </div>
            </div>

            <div class="sidebar-section spacer"></div>

            <div class="sidebar-menu">
                <button id="new-game-btn" class="menu-btn">Restart Level</button>
                <button id="save-game-btn" class="menu-btn">Save Progress</button>
            </div>
        </aside>

        <!-- CENTER: Dashboard & Board -->
        <main id="main-content">

            <!-- Top Header Metrics -->
            <header id="metrics-header">
                <div class="metric-card">
                    <span class="label">BUDGET</span>
                    <span class="value" id="metric-budget">$0</span>
                </div>
                <div class="metric-card">
                    <span class="label">STABILITY</span>
                    <span class="value" id="metric-stability">0%</span>
                </div>
                <div class="metric-card">
                    <span class="label">UNPLANNED WORK</span>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="metric-unplanned-bar" style="width: 0%;"></div>
                    </div>
                    <span class="value-sub" id="metric-unplanned-text">0%</span>
                </div>
                <div class="metric-card">
                    <span class="label">WEEK</span>
                    <span class="value" id="metric-week">1</span>
                </div>
            </header>

            <!-- Kanban Board -->
            <div id="board-container">
                <div class="kanban-column" id="backlog" data-column-id="backlog">
                    <div class="column-header">
                        <h2>BACKLOG</h2>
                        <span class="count">0</span>
                    </div>
                    <div class="task-list"></div>
                </div>

                <div class="kanban-column" id="in_progress" data-column-id="in_progress">
                    <div class="column-header">
                        <h2>IN PROGRESS</h2>
                        <span class="wip-badge">WIP: <span id="wip-current">0</span>/<span id="wip-limit">0</span></span>
                    </div>
                    <div class="task-list"></div>
                </div>

                <div class="kanban-column" id="review" data-column-id="review">
                    <div class="column-header">
                        <h2>REVIEW</h2>
                        <span class="count">0</span>
                    </div>
                    <div class="task-list"></div>
                </div>

                <div class="kanban-column" id="done" data-column-id="done">
                    <div class="column-header">
                        <h2>DONE</h2>
                        <span class="count">0</span>
                    </div>
                    <div class="task-list"></div>
                </div>
            </div>
        </main>

        <!-- RIGHT PANEL: Mentor & Comms -->
        <aside id="right-panel">
            <div class="panel-tabs">
                <button class="tab-btn active" data-tab="mentor">MENTOR</button>
                <button class="tab-btn" data-tab="chat">TEAM CHAT</button>
            </div>

            <div id="mentor-tab" class="tab-content active">
                <div class="erik-avatar">
                    <div class="avatar-circle">E</div>
                    <div class="erik-status">Erik is watching...</div>
                </div>
                <div id="mentor-log" class="log-scroll">
                    <!-- Messages from Erik -->
                </div>
            </div>

            <div id="chat-tab" class="tab-content">
                <div id="chat-log" class="log-scroll">
                    <!-- Team Chat -->
                </div>
            </div>
        </aside>

    </div>

    <!-- Minigame Modal Overlay (Preserved) -->
    <div id="minigame-modal" class="modal-overlay" style="display: none;">
        <!-- Content generated dynamically or same as before -->
    </div>

    <script src="script.js"></script>
</body>
</html>
