<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проект Феникс: Симулятор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-container">
        <div id="game-container">
            <div id="metrics-display"></div>
            <div id="events-container">
                <!-- Активные события (кризисы, квизы) будут здесь -->
            </div>
        </div>
        <div id="jira-board-container">
            <h2>Jira Доска</h2>
            <div id="jira-board">
                <div class="jira-column" id="backlog" data-column-id="backlog">
                    <h3>Backlog</h3>
                </div>
                <div class="jira-column" id="in_progress" data-column-id="in_progress">
                    <h3>In Progress</h3>
                </div>
                <div class="jira-column" id="review" data-column-id="review">
                    <h3>Review</h3>
                </div>
                <div class="jira-column" id="done" data-column-id="done">
                    <h3>Done</h3>
                </div>
            </div>
        </div>
    </div>
    <div id="gantt-chart-container">
        <h2>График Ганта</h2>
        <div id="gantt-chart"></div>
    </div>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script src="script.js"></script>
</body>
</html>
